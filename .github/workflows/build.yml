name: Build

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build (universal, ad-hoc signed)
        run: |
          set -o pipefail
          xcodebuild \
            -project DeskPad.xcodeproj \
            -scheme DeskPad \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=macOS' \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package
        run: |
          APP="build/Build/Products/Release/DeskPad.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/DeskPad"
          mkdir -p dist dmg
          ditto -c -k --keepParent "$APP" dist/DeskPad.zip
          cp -R "$APP" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname DeskPad -srcfolder dmg -ov -format UDZO dist/DeskPad.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: DeskPad-${{ github.sha }}
          path: dist/
